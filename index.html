<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIA RJ - Serviços de Trânsito</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- BOTÃO DE TEMA -->

    <div class="area-acessibilidade">

    <button
        id="botaoAcessibilidade"
        class="botao-acessibilidade"
        type="button"
        aria-label="Abrir opções de acessibilidade"
        aria-expanded="false"
        aria-controls="painelAcessibilidade"
    >
        Aa
    </button>

    <div
        id="painelAcessibilidade"
        class="painel-acessibilidade"
        hidden
    >
        <strong>Acessibilidade</strong>

        <button
            id="botaoAumentarTexto"
            type="button"
        >
            Aumentar texto
        </button>

        <button
            id="botaoReduzirMovimento"
            type="button"
            aria-pressed="false"
        >
            Reduzir animações
        </button>

        <button
            id="botaoResetarAcessibilidade"
            type="button"
        >
            Restaurar padrão
        </button>
    </div>

</div>

    <button
        id="botaoTema"
        class="botao-tema"
        type="button"
        aria-label="Ativar modo escuro"
        title="Alternar modo claro/escuro"
    >
        <span aria-hidden="true">◐</span>
    </button>


    <!-- CABEÇALHO -->
    <header>

        <img
            src="images/logo-via-rj.png"
            alt="VIA RJ - Seu caminho para os serviços de trânsito"
            class="logo-via-rj"
        >

        <p class="aviso-independente">
            Projeto independente e acadêmico.
            Não é um canal oficial do DETRAN-RJ.
        </p>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <h2>Como podemos ajudar?</h2>

        <label for="pesquisa">
            Qual serviço você procura?
        </label>

        <div class="area-pesquisa">

            <input
                type="text"
                id="pesquisa"
                placeholder="Digite o serviço que você procura"
            >

            <button id="botaoPesquisar">
                Pesquisar
            </button>

        </div>

        <div id="sugestoes"></div>


        <!-- CATEGORIAS -->
        <section id="servicos">

            <h2>Serviços</h2>

            <div class="lista-categorias">

    <button
        class="categoria"
        data-categoria="Habilitação"
        type="button"
    >
        <svg class="icone-categoria" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="8" cy="11" r="2"></circle>
            <path d="M5.5 16c.8-1.8 4.2-1.8 5 0"></path>
            <path d="M13 9h5M13 12h5M13 15h3"></path>
        </svg>

        <span>Habilitação</span>
    </button>


    <button
        class="categoria"
        data-categoria="Veículos"
        type="button"
    >
        <svg class="icone-categoria" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 17h14"></path>
            <path d="M6 17v2M18 17v2"></path>
            <path d="M4 13l2-5h12l2 5v4H4z"></path>
            <circle cx="7" cy="14" r="1"></circle>
            <circle cx="17" cy="14" r="1"></circle>
        </svg>

        <span>Veículo</span>
    </button>


    <button
        class="categoria"
        data-categoria="Identificação"
        type="button"
    >
        <svg class="icone-categoria" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
            <circle cx="12" cy="9" r="3"></circle>
            <path d="M7.5 17c1.2-3 7.8-3 9 0"></path>
        </svg>

        <span>Identificação Civil</span>
    </button>


    <button
        class="categoria"
        data-categoria="Infrações"
        type="button"
    >
        <svg class="icone-categoria" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3L2.5 20h19z"></path>
            <path d="M12 9v5"></path>
            <circle cx="12" cy="17" r=".7"></circle>
        </svg>

        <span>Infrações</span>
    </button>

</div>

        </div>


        <!-- ACESSOS RÁPIDOS -->
        <section
            class="acessos-rapidos"
            aria-labelledby="tituloAcessosRapidos"
        >

            <h3 id="tituloAcessosRapidos">
                Acessos rápidos
            </h3>

            <div class="lista-acessos-rapidos">

                <a
                    href="https://www.detran.rj.gov.br/todos-os-agendamentos"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="acesso-rapido"
                >
                    <span aria-hidden="true">📅</span>
                    Agendamento
                </a>

                <a
                    href="https://www.detran.rj.gov.br/detran-rj/posto-digital.html"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="acesso-rapido"
                >
                    <span aria-hidden="true">↗</span>
                    Detran RJ Digital
                </a>

                <a
                    href="https://www.detran.rj.gov.br/todos-os-servicos"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="acesso-rapido"
                >
                    <span aria-hidden="true">☰</span>
                    Todos os serviços
                </a>

            </div>

        </section>


    </section>

    <!-- RESULTADOS -->

        </section>


        <!-- RESULTADOS -->
        <section
            id="resultado"
            aria-live="polite"
        ></section>

    </main>


    <script src="script.js"></script>

</body>

</html>
